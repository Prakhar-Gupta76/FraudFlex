[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudflux"
version = "0.13.0"
description = "Real-time payment fraud detection system"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.6,<3",
    "fastapi>=0.111,<1",
    "joblib>=1.3,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
fraudflux-kafka-check = "fraudflux_kafka.broker:main"
fraudflux-simulate = "fraudflux_simulator.cli:main"
fraudflux-train-anomaly = "fraudflux_anomaly.cli:main"

[tool.setuptools.packages.find]
include = [
    "fraudflux_anomaly*",
    "fraudflux_api*",
    "fraudflux_decision*",
    "fraudflux_events*",
    "fraudflux_kafka*",
    "fraudflux_features*",
    "fraudflux_risk*",
    "fraudflux_rules*",
    "fraudflux_simulator*",
    "fraudflux_storage*",
    "fraudflux_validation*",
    "fraudflux_worker*",
]

[tool.setuptools.package-data]
fraudflux_rules = ["rulesets/*.yaml", "rulesets/*.md"]
