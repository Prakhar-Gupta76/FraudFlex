[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudflux"
version = "0.6.0"
description = "Real-time payment fraud detection system"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
]

[project.scripts]
fraudflux-kafka-check = "fraudflux_kafka.broker:main"
fraudflux-simulate = "fraudflux_simulator.cli:main"

[tool.setuptools.packages.find]
include = [
    "fraudflux_kafka*",
    "fraudflux_features*",
    "fraudflux_simulator*",
    "fraudflux_validation*",
    "fraudflux_worker*",
]
