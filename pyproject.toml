[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudflux-simulator"
version = "0.1.0"
description = "Deterministic synthetic payment transaction simulator for FraudFlux"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fraudflux-simulate = "fraudflux_simulator.cli:main"

[tool.setuptools.packages.find]
include = ["fraudflux_simulator*"]

