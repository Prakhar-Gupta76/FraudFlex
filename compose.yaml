name: fraudflux

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: fraudflux-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "fraudflux"
      POSTGRES_USER: "fraudflux"
      POSTGRES_PASSWORD: "fraudflux"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/001_feature_history.sql:/docker-entrypoint-initdb.d/001_feature_history.sql:ro
      - ./infra/postgres/002_operational_storage.sql:/docker-entrypoint-initdb.d/002_operational_storage.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U fraudflux -d fraudflux
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 384m

  kafka:
    image: apache/kafka:4.3.1
    container_name: fraudflux-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_NUM_PARTITIONS: "3"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_SEGMENT_BYTES: "67108864"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s
    mem_limit: 1g

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: fraudflux-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
    volumes:
      - ./infra/kafka/create-topics.sh:/opt/fraudflux/create-topics.sh:ro
    entrypoint:
      - /bin/bash
      - /opt/fraudflux/create-topics.sh
    restart: "no"
    mem_limit: 512m

volumes:
  kafka-data:
    name: fraudflux-kafka-data
  postgres-data:
    name: fraudflux-postgres-data
